server.port=8080
spring.application.name=api-gateway
spring.config.import=optional:configserver:http://localhost:8888
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.routes[0].id=service-praticiens-doctors
spring.cloud.gateway.routes[0].uri=lb://service-praticiens
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/doctors/**

spring.cloud.gateway.routes[1].id=service-praticiens-availabilities
spring.cloud.gateway.routes[1].uri=lb://service-praticiens
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/availabilities/**

spring.cloud.gateway.routes[2].id=service-patients
spring.cloud.gateway.routes[2].uri=lb://service-patients
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/patients/**

spring.cloud.gateway.routes[3].id=service-patients-records
spring.cloud.gateway.routes[3].uri=lb://service-patients
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/medical-records/**

spring.cloud.gateway.routes[4].id=service-rendezvous
spring.cloud.gateway.routes[4].uri=lb://service-rendezvous
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/appointments/**

spring.cloud.gateway.routes[5].id=service-notification
spring.cloud.gateway.routes[5].uri=lb://service-notification
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/notifications/**

spring.cloud.gateway.routes[6].id=service-batch-analytics
spring.cloud.gateway.routes[6].uri=lb://service-batch-analytics
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/batch/**
