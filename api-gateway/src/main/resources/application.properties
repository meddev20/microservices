server.port=8080
spring.application.name=api-gateway
spring.config.import=optional:configserver:http://localhost:8888/

# Redis Configuration (Rate Limiting)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Dynamic Discovery Locator
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Static Routes
spring.cloud.gateway.routes[0].id=rendezvous-service
spring.cloud.gateway.routes[0].uri=lb://service-rendezvous
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/appointments/**

spring.cloud.gateway.routes[1].id=praticiens-service
spring.cloud.gateway.routes[1].uri=lb://service-praticiens
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/doctors/**,/api/v1/availabilities/**

spring.cloud.gateway.routes[2].id=patients-service
spring.cloud.gateway.routes[2].uri=lb://service-patients
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/patients/**,/api/v1/medical-records/**

spring.cloud.gateway.routes[3].id=notification-service
spring.cloud.gateway.routes[3].uri=lb://service-notification
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/notifications/**

spring.cloud.gateway.routes[4].id=batch-analytics-service
spring.cloud.gateway.routes[4].uri=lb://service-batch-analytics
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/batch/**

management.endpoints.web.exposure.include=health,info,gateway
