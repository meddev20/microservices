server.port=8083
spring.application.name=service-rendezvous
spring.config.import=optional:configserver:http://localhost:8888/

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/rendezvous_db
spring.datasource.username=medrdv_user
spring.datasource.password=medrdv_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=rendezvous-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.medrdv.*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# OpenFeign Clients URLs (fallback si Eureka n'est pas utilisé)
clients.praticiens.url=http://localhost:8081
clients.patients.url=http://localhost:8082

# Resilience4j Ordering & Properties (Jalon V6)
resilience4j.retry.retry-aspect-order=1
resilience4j.circuitbreaker.circuit-breaker-aspect-order=2

resilience4j.retry.instances.service-patients.max-attempts=3
resilience4j.retry.instances.service-patients.wait-duration=500ms
resilience4j.retry.instances.service-praticiens.max-attempts=3
resilience4j.retry.instances.service-praticiens.wait-duration=500ms

resilience4j.circuitbreaker.instances.service-patients.sliding-window-size=6
resilience4j.circuitbreaker.instances.service-patients.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.service-patients.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.service-patients.wait-duration-in-open-state=5s

resilience4j.circuitbreaker.instances.service-praticiens.sliding-window-size=6
resilience4j.circuitbreaker.instances.service-praticiens.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.service-praticiens.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.service-praticiens.wait-duration-in-open-state=5s

resilience4j.ratelimiter.instances.consultation.limit-for-period=5
resilience4j.ratelimiter.instances.consultation.limit-refresh-period=1s
resilience4j.ratelimiter.instances.consultation.timeout-duration=0ms

management.endpoints.web.exposure.include=health,info,metrics
